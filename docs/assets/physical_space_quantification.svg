<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="t d"><title id="t">Thickness and physical slice separation</title><desc id="d">Four slice slabs have unequal centre-to-centre intervals along the patient-coordinate normal. The slab thickness is distinct from the distance between slice centres. Missing or unreviewed gaps require quality control.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#426478" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><text x="22" y="30" fill="#142d45" font-size="19">Patient-coordinate slice positions</text><text x="22" y="55" fill="#5b6d7c" font-size="16">Schematic · unequal intervals</text><path d="M45 156H572" stroke="#426478" marker-end="url(#arrow)"/><g fill="#dbedf0" stroke="#78aeb9"><rect x="70" y="86" width="28" height="107"/><rect x="188" y="86" width="28" height="107"/><rect x="367" y="86" width="28" height="107"/><rect x="505" y="86" width="28" height="107"/></g><g stroke="#076b70" stroke-dasharray="4 4"><path d="M84 77v137"/><path d="M202 77v137"/><path d="M381 77v137"/><path d="M519 77v137"/></g><g stroke="#426478" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M88 214h110"/><path d="M206 214h171"/><path d="M385 214h130"/></g><g fill="#142d45" font-size="19"><text x="130" y="242">Δs₁</text><text x="276" y="242">Δs₂</text><text x="437" y="242">Δs₃</text></g><g fill="#076b70" font-size="17"><text x="73" y="74">s₁</text><text x="191" y="74">s₂</text><text x="370" y="74">s₃</text><text x="508" y="74">s₄</text></g><path d="M617 48v174" stroke="#c4d5df"/><text x="650" y="85" fill="#142d45" font-size="18">Nominal thickness</text><text x="650" y="111" fill="#5b6d7c" font-size="16">Describes an acquired slab.</text><text x="650" y="159" fill="#076b70" font-size="18">Actual separation</text><text x="650" y="185" fill="#5b6d7c" font-size="16">Defines integration intervals.</text><text x="650" y="218" fill="#795020" font-size="15">Gaps require explicit QC.</text></g></svg>
