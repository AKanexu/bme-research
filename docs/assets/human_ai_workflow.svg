<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="t d"><title id="t">Human–AI segmentation workflow</title><desc id="d">Clinical identification and a box prompt lead to MedSAM initial masks and expert review. Correction and final verification complete the intended workflow. The first three stages are evidenced by a small local pilot; cohort completion is ongoing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#7593a4" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><path d="M14 34H570" stroke="#0b7273" stroke-width="2"/><text x="14" y="23" fill="#076b70" font-size="16">SMALL PILOT: PROMPT → MASK → REVIEW</text><path d="M606 34H985" stroke="#a57d4a" stroke-width="2" stroke-dasharray="5 4"/><text x="606" y="23" fill="#795020" font-size="16">DEVELOPING COHORT WORKFLOW</text><g fill="#fff" stroke="#b3cbd4"><rect x="14" y="59" width="165" height="143" rx="2"/><rect x="213" y="59" width="165" height="143" rx="2"/><rect x="412" y="59" width="165" height="143" rx="2"/></g><g fill="#fff" stroke="#bba787" stroke-dasharray="5 4"><rect x="611" y="59" width="165" height="143" rx="2"/><rect x="810" y="59" width="175" height="143" rx="2"/></g><g stroke="#7593a4" marker-end="url(#a)"><path d="M182 129h24"/><path d="M381 129h24"/><path d="M580 129h24"/><path d="M779 129h24"/></g><g fill="#076b70" font-size="16"><text x="30" y="88">01</text><text x="229" y="88">02</text><text x="428" y="88">03</text></g><g fill="#795020" font-size="16"><text x="627" y="88">04</text><text x="826" y="88">05</text></g><g fill="#142d45" font-size="21"><text x="30" y="124">Identify</text><text x="30" y="151">&amp; prompt</text><text x="229" y="124">MedSAM</text><text x="229" y="151">initial mask</text><text x="428" y="124">Expert</text><text x="428" y="151">review</text><text x="627" y="124">Correct</text><text x="627" y="151">as needed</text><text x="826" y="124">Verified</text><text x="826" y="151">mask</text></g><g fill="#5b6d7c" font-size="15"><text x="30" y="181">Lesion + bounding box</text><text x="229" y="181">Candidate boundary</text><text x="428" y="181">Assess &amp; flag</text><text x="627" y="181">Expert revision</text><text x="826" y="181">For quantification</text></g><text x="14" y="245" fill="#5b6d7c" font-size="16">A conceptual workflow. Model output becomes a measurement only after appropriate verification.</text></g></svg>
