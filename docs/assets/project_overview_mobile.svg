<svg xmlns="http://www.w3.org/2000/svg" width="420" height="390" viewBox="0 0 420 390" role="img" aria-labelledby="t d"><title id="t">Preserve geometry from mask to measurement</title><desc id="d">Three schematic masked slice planes and equations describing physical area and volume. Developing method only.</desc><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#426478" stroke-width=".7"/></pattern></defs><rect width="420" height="390" fill="#142d45"/><g font-family="Arial,sans-serif"><text x="24" y="37" fill="#fff" font-size="21">Preserve the geometry.</text><g transform="translate(62 130) matrix(1 .18 -.4 .45 0 0)"><rect width="220" height="160" fill="#1c3c55" stroke="#759eaf"/><rect width="220" height="160" fill="url(#g)"/><path d="M80 40h60v20h20v60H80z" fill="#4fa7ac"/></g><g transform="translate(84 102) matrix(1 .18 -.4 .45 0 0)"><rect width="220" height="160" fill="#1c3c55" stroke="#759eaf"/><rect width="220" height="160" fill="url(#g)"/><path d="M60 40h100v20h20v60H60z" fill="#4fb7ba"/></g><g transform="translate(107 74) matrix(1 .18 -.4 .45 0 0)"><rect width="220" height="160" fill="#1c3c55" stroke="#bad9df"/><rect width="220" height="160" fill="url(#g)"/><path d="M80 40h60v20h20v60H80z" fill="#66d1cf"/><rect x="60" y="20" width="120" height="120" fill="none" stroke="#eac28b" stroke-width="2" stroke-dasharray="6 4"/></g><g fill="#9cc9d1" font-size="17"><text x="344" y="122">s₃</text><text x="323" y="163">s₂</text><text x="302" y="204">s₁</text></g><path d="M24 235H396" stroke="#406077"/><text x="24" y="273" font-family="Georgia,serif" font-size="24" fill="#fff">Aᵢ = Nᵢ × Δxᵢ × Δyᵢ</text><text x="24" y="312" font-family="Georgia,serif" font-size="23" fill="#80e1d9">V ≈ ∑ ½(Aᵢ + Aᵢ₊₁) Δsᵢ</text><text x="24" y="351" fill="#bfd3df" font-size="16">Actual positions, not image indices.</text><text x="24" y="374" fill="#bfd3df" font-size="14">Developing method · schematic only</text></g></svg>
