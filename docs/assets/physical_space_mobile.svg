<svg xmlns="http://www.w3.org/2000/svg" width="400" height="350" viewBox="0 0 400 350" role="img" aria-labelledby="t d"><title id="t">Actual slice separation</title><desc id="d">Schematic slabs at unequal centre positions. Thickness describes a slab; centre separation defines the integration interval.</desc><g font-family="Arial,sans-serif"><text x="14" y="29" fill="#142d45" font-size="20">Actual slice positions</text><text x="14" y="53" fill="#5b6d7c" font-size="15">Schematic · unequal intervals</text><path d="M20 129H375" stroke="#426478"/><g fill="#dbedf0" stroke="#78aeb9"><rect x="38" y="90" width="22" height="90"/><rect x="115" y="90" width="22" height="90"/><rect x="231" y="90" width="22" height="90"/><rect x="326" y="90" width="22" height="90"/></g><g stroke="#076b70" stroke-dasharray="4 4"><path d="M49 80v119"/><path d="M126 80v119"/><path d="M242 80v119"/><path d="M337 80v119"/></g><path d="M49 196h288" stroke="#426478"/><g fill="#142d45" font-size="19"><text x="72" y="221">Δs₁</text><text x="166" y="221">Δs₂</text><text x="274" y="221">Δs₃</text></g><g fill="#076b70" font-size="17"><text x="40" y="81">s₁</text><text x="116" y="81">s₂</text><text x="232" y="81">s₃</text><text x="327" y="81">s₄</text></g><text x="14" y="264" fill="#142d45" font-size="17">Thickness describes a slab.</text><text x="14" y="294" fill="#076b70" font-size="17">Separation defines the interval.</text><text x="14" y="328" fill="#795020" font-size="15">Gaps and coverage require explicit QC.</text></g></svg>
